<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>势研 · A股市场状态研判</title>
  <style>
:root {
  --bg: #f2f4f6;
  --panel: #ffffff;
  --panel-alt: #fafbfc;
  --ink: #14171c;
  --ink-2: #333b46;
  --muted: #6b7480;
  --faint: #98a0ab;
  --line: #e1e5ea;
  --line-strong: #c9d0d8;
  --up: #b02a22;
  --up-soft: #fbeeec;
  --down: #0c6f54;
  --down-soft: #e8f4ef;
  --warn: #96600b;
  --warn-soft: #fcf2e0;
  --focus: #17697f;
  --focus-soft: #e6f2f5;
  --radius: 6px;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
a { color: var(--focus); text-decoration: none; }
a:hover { text-decoration: underline; }

.num, .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.mono { font-family: var(--mono); }

/* ---------------------------------------------------------------- topbar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 56px;
  padding: 0 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 22px; height: 22px; color: var(--ink); }
.brand-text { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand-text strong { font-size: 16px; letter-spacing: 2px; }
.brand-text span { font-size: 11px; color: var(--muted); letter-spacing: .5px; white-space: nowrap; }

.topbar-meta { display: flex; align-items: center; gap: 8px; }
.meta-item { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; margin-right: 4px; }
.meta-label { font-size: 10px; color: var(--faint); letter-spacing: .5px; }
.meta-value { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); }

.integrity-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--panel);
  font-size: 11px;
  color: var(--ink-2);
}
.integrity-pill:hover { background: var(--panel-alt); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--down); flex: none; }
.dot.partial { background: var(--warn); }
.dot.critical { background: var(--up); }

.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--ink-2);
}
.icon-button:hover { background: var(--panel-alt); border-color: var(--faint); }
.icon-button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.icon-button.spinning svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------ tabs */
.tabs {
  position: sticky;
  top: 56px;
  z-index: 25;
  display: flex;
  gap: 2px;
  padding: 0 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.tab {
  position: relative;
  padding: 10px 14px 11px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); font-weight: 600; }
.tab.active::after {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: -1px;
  height: 2px;
  background: var(--focus);
}
.tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* ------------------------------------------------------------------ main */
main { max-width: 1400px; margin: 0 auto; padding: 18px 24px 64px; }
.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 96px 0; color: var(--muted); }
.spinner { width: 22px; height: 22px; border: 2px solid var(--line-strong); border-top-color: var(--focus); border-radius: 50%; animation: spin .8s linear infinite; }

.view { display: flex; flex-direction: column; gap: 14px; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 2px 2px 0; }
.view-head h1 { margin: 0; font-size: 18px; line-height: 1.3; letter-spacing: .2px; }
.view-head .sub { margin: 2px 0 0; color: var(--muted); font-size: 11px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
}
.panel-head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .2px; }
.panel-head .sub { font-size: 11px; color: var(--muted); }
.panel-body { padding: 14px; }

.eyebrow { margin: 0 0 4px; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.up { color: var(--up); }
.down { color: var(--down); }
.warn { color: var(--warn); }
.flat { color: var(--muted); }

/* ------------------------------------------------------------------ hero */
.state-band {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
  gap: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.state-main { padding: 18px 20px; }
.state-kicker { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.state-kicker .sep { width: 1px; height: 10px; background: var(--line-strong); }
.state-label { margin: 8px 0 6px; font-size: 26px; line-height: 1.25; font-weight: 600; letter-spacing: .3px; }
.state-summary { margin: 0; max-width: 66ch; color: var(--ink-2); font-size: 13px; }
.state-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px;
  border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel-alt); font-size: 11px; color: var(--ink-2);
}
.tag.alert { border-color: #e8cfa6; background: var(--warn-soft); color: var(--warn); }

.state-side {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-left: 1px solid var(--line);
  background: var(--panel-alt);
}
.state-cell { padding: 16px 18px; }
.state-cell + .state-cell { border-left: 1px solid var(--line); }
.state-cell .k { font-size: 10px; color: var(--faint); letter-spacing: .6px; }
.state-cell .v { margin-top: 4px; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.state-cell .n { margin-top: 2px; font-size: 11px; color: var(--muted); }

/* ------------------------------------------------------------- dimension */
.dimension-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
}
.dim {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 11px 12px 10px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 116px;
  overflow: hidden;
}
.dim:hover { border-color: var(--line-strong); }
.dim:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.dim-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.dim-name { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.dim-score { font-size: 10px; font-variant-numeric: tabular-nums; color: var(--faint); }
.dim-state { font-size: 12px; color: var(--ink); }
.dim-metrics { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
.dim-metric { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--muted); }
.dim-metric b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.spark { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; opacity: .5; }

.score-track {
  position: relative;
  margin-top: auto;
  padding-top: 7px;
  height: 4px;
  background: linear-gradient(90deg, #e3efe9 0%, #eef0f2 50%, #f7e7e5 100%);
  border-radius: 2px;
}
.score-zero { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #cfd5dc; }
.score-mark {
  position: absolute;
  top: -2px;
  width: 3px;
  height: 8px;
  margin-left: -1.5px;
  border-radius: 1px;
  background: var(--ink);
}

ul.list { margin: 8px 0 0; padding-left: 16px; color: var(--ink-2); font-size: 12px; }
ul.list li { margin-bottom: 4px; }

/* ------------------------------------------------------------------ grid */
.overview-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.62fr) minmax(340px, 1fr);
  gap: 14px;
  align-items: start;
}

/* ----------------------------------------------------------------- table */
.table-wrap { overflow-x: auto; }
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
table.data th {
  padding: 7px 10px;
  text-align: right;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: .4px;
  color: var(--faint);
  background: var(--panel-alt);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data td {
  padding: 8px 10px;
  text-align: right;
  border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover { background: var(--panel-alt); }
table.data .name { font-variant-numeric: normal; color: var(--ink); }
table.data .code { font-size: 10px; color: var(--faint); font-family: var(--mono); margin-left: 6px; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 6px; border-radius: 3px;
  font-size: 10px; line-height: 16px;
  border: 1px solid transparent;
}
.pill.ok { background: var(--down-soft); color: var(--down); border-color: #cbe6dc; }
.pill.stale { background: var(--warn-soft); color: var(--warn); border-color: #ecd7ae; }
.pill.error, .pill.conflict, .pill.missing { background: var(--up-soft); color: var(--up); border-color: #eec7c3; }
.pill.neutral { background: #eef1f4; color: var(--muted); border-color: #dfe4e9; }

/* ---------------------------------------------------------------- assistant */
.assistant { display: flex; flex-direction: column; min-height: 420px; }
.assistant .panel-body { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.ask-box { display: flex; gap: 6px; }
.ask-box input {
  flex: 1; min-width: 0;
  height: 32px; padding: 0 10px;
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--panel); color: var(--ink); font-family: inherit; font-size: 12px;
}
.ask-box input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus-soft); }
.ask-box button {
  height: 32px; padding: 0 12px;
  border: 1px solid var(--ink); border-radius: var(--radius);
  background: var(--ink); color: #fff; font-size: 12px;
}
.ask-box button:disabled { opacity: .45; cursor: default; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 3px 8px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel-alt); color: var(--muted); font-size: 11px;
}
.chip:hover { border-color: var(--line-strong); color: var(--ink); }

.plan { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.plan-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; background: var(--panel-alt);
  border-bottom: 1px solid var(--line);
  font-size: 10px; letter-spacing: .5px; color: var(--faint);
}
.plan-step { display: flex; gap: 8px; padding: 7px 10px; font-size: 11px; border-bottom: 1px solid var(--line); }
.plan-step:last-child { border-bottom: 0; }
.plan-step .idx { color: var(--faint); font-family: var(--mono); font-size: 10px; padding-top: 1px; }
.plan-step .needs { color: var(--muted); }

.answer { display: flex; flex-direction: column; gap: 8px; }
.answer-block {
  padding: 9px 10px;
  background: var(--panel-alt);
  border-left: 2px solid var(--line-strong);
  font-size: 12px;
  color: var(--ink-2);
}
.answer-refs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.ref {
  font-family: var(--mono); font-size: 10px;
  color: var(--focus); background: var(--focus-soft);
  border: 0; border-radius: 3px; padding: 1px 5px;
}
.ref:hover { text-decoration: underline; }
.blocked {
  padding: 12px;
  border: 1px solid #e8cfa6; background: var(--warn-soft);
  border-radius: var(--radius); color: #6d4708; font-size: 12px;
}
.blocked strong { display: block; margin-bottom: 4px; color: var(--warn); }

/* --------------------------------------------------------------- switches */
.switch-row td { white-space: normal; }
.switch-cond { color: var(--ink-2); }
.switch-effect { color: var(--muted); font-size: 11px; }
.meter { display: inline-block; width: 62px; height: 4px; background: #eceff2; border-radius: 2px; overflow: hidden; vertical-align: middle; margin-left: 6px; }
.meter i { display: block; height: 100%; background: var(--focus); }

/* --------------------------------------------------------------- industry */
.industry-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.bar-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; gap: 8px; align-items: center; padding: 3px 0; font-size: 11px; }
.bar-track { position: relative; height: 14px; background: var(--panel-alt); border-radius: 2px; overflow: hidden; }
.bar-track .zero { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-strong); }
.bar-fill { position: absolute; top: 3px; height: 8px; border-radius: 1px; }
.bar-name { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; }

/* ----------------------------------------------------------------- charts */
.chart { width: 100%; display: block; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 10px; color: var(--muted); padding: 0 14px 10px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-swatch { width: 10px; height: 3px; border-radius: 2px; }
.chart-note { padding: 0 14px 12px; font-size: 10px; color: var(--faint); }

/* ------------------------------------------------------------- evidence */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); }
.search svg { width: 13px; height: 13px; fill: none; stroke: var(--faint); stroke-width: 1.8; }
.search input { border: 0; outline: 0; background: none; font-family: inherit; font-size: 12px; width: 190px; color: var(--ink); }
.select {
  height: 28px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--panel); font-family: inherit; font-size: 12px; color: var(--ink-2);
}
td.clickable { cursor: pointer; }
td.clickable:hover { color: var(--focus); }

.drawer-backdrop { position: fixed; inset: 0; background: rgba(20, 23, 28, .28); z-index: 60; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 94vw);
  background: var(--panel); border-left: 1px solid var(--line-strong);
  z-index: 61; display: flex; flex-direction: column;
  animation: slide .18s ease-out;
}
@keyframes slide { from { transform: translateX(16px); opacity: .6; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 15px; }
.drawer-body { padding: 16px 18px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 6px 12px; font-size: 12px; }
.kv dt { color: var(--faint); font-size: 11px; }
.kv dd { margin: 0; color: var(--ink-2); word-break: break-word; }
pre.raw {
  margin: 0; padding: 10px; max-height: 320px; overflow: auto;
  background: #f6f8fa; border: 1px solid var(--line); border-radius: 4px;
  font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--ink-2);
}

.dialog-backdrop { position: fixed; inset: 0; background: rgba(20, 23, 28, .28); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 20px; }
.dialog { width: min(560px, 100%); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 14px; }
#dialog-body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; font-size: 12px; }
.issue { display: flex; gap: 8px; padding: 8px 10px; border-radius: 4px; background: var(--panel-alt); border-left: 2px solid var(--line-strong); }
.issue.critical { border-left-color: var(--up); background: var(--up-soft); }
.issue.warning { border-left-color: var(--warn); background: var(--warn-soft); }
.sim-row { display: flex; flex-wrap: wrap; gap: 6px; }
.sim-row button { padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--panel); font-size: 11px; }
.sim-row button.active { border-color: var(--focus); background: var(--focus-soft); color: var(--focus); }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  padding: 8px 14px; border-radius: 6px;
  background: var(--ink); color: #fff; font-size: 12px; z-index: 80;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
}

.empty { padding: 28px 14px; text-align: center; color: var(--faint); font-size: 12px; }
.footnote { font-size: 10px; color: var(--faint); line-height: 1.6; }

.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.stat { padding: 12px 14px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat .k { font-size: 10px; color: var(--faint); letter-spacing: .4px; }
.stat .v { margin-top: 3px; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .n { font-size: 10px; color: var(--muted); }

@media (max-width: 1180px) {
  .dimension-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .overview-grid { grid-template-columns: minmax(0, 1fr); }
  .industry-layout { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 820px) {
  .topbar { padding: 0 14px; height: auto; min-height: 56px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
  .tabs { top: 0; position: static; padding: 0 8px; }
  main { padding: 12px 12px 48px; }
  .state-band { grid-template-columns: 1fr; }
  .state-side { border-left: 0; border-top: 1px solid var(--line); }
  .state-label { font-size: 21px; }
  .dimension-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two-col { grid-template-columns: minmax(0, 1fr); }
  .stat-row { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid var(--line); }
  .brand-text span { display: none; }
  .meta-item { display: none; }
}

</style>
</head>
<body data-build="static">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 17.5 8.5 12l3.6 3.2L21 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15.5 6H21v5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-text">
        <strong>势研</strong>
        <span>市场状态研判 · A 股</span>
      </div>
    </div>
    <div class="topbar-meta">
      <div class="meta-item">
        <span class="meta-label">数据时点</span>

<script>
/* Market Lens — evidence-first market regime research UI */

const state = {
  overview: null,
  industry: null,
  view: "overview",
  simulate: null,
  busy: false,
  ask: null,
  staticPreviews: null,
};

const EMBEDDED = document.getElementById("market-data");
const STATIC_MODE = Boolean(EMBEDDED);

const DIM_LABEL = {
  structure: "行情结构",
  breadth: "市场宽度",
  style: "风格轮动",
  valuation: "估值",
  liquidity: "流动性",
  sentiment: "情绪",
  risk: "风险变量",
};

/* ------------------------------------------------------------------ utils */

const SVG_NS = "http://www.w3.org/2000/svg";
const SVG_TAGS = new Set([
  "svg", "g", "path", "text", "line", "circle", "rect", "defs",
  "linearGradient", "stop", "polyline", "ellipse", "tspan",
]);

function h(tag, props, ...children) {
  const node = SVG_TAGS.has(tag)
    ? document.createElementNS(SVG_NS, tag)
    : document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") {
      if (node instanceof SVGElement) node.setAttribute("class", value);
      else node.className = value;
    }
    else if (key === "text") node.textContent = value;
    else if (key === "html") node.innerHTML = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2).toLowerCase(), value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat(4)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

const fx = (v, digits = 2) =>
  v === null || v === undefined || Number.isNaN(v) ? "—" : Number(v).toFixed(digits);
const signed = (v, digits = 2, suffix = "%") =>
  v === null || v === undefined || Number.isNaN(v) ? "—" : `${Number(v) >= 0 ? "+" : ""}${Number(v).toFixed(digits)}${suffix}`;
const dirClass = (v) => (v === null || v === undefined ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat");
const pctText = (v, digits = 1) => (v === null || v === undefined ? "—" : `${Number(v).toFixed(digits)}%`);
const money = (v) => {
  if (v === null || v === undefined) return "—";
  if (Math.abs(v) >= 1e12) return `${(v / 1e12).toFixed(2)} 万亿`;
  if (Math.abs(v) >= 1e8) return `${(v / 1e8).toFixed(0)} 亿`;
  return `${(v / 1e4).toFixed(0)} 万`;
};
const dayLabel = (iso) => (iso ? iso.replaceAll("-", ".") : "—");

function table(headers, rows, opts = {}) {
  return h("div", { class: "table-wrap" },
    h("table", { class: "data" },
      h("thead", {}, h("tr", {}, headers.map((x) => h("th", { text: x })))),
      h("tbody", {}, rows),
    ),
  );
}

function panel(title, sub, body, extra) {
  return h("section", { class: "panel" },
    h("div", { class: "panel-head" },
      h("h2", { text: title }),
      sub || extra ? h("div", { class: "sub" }, sub ? h("span", { text: sub }) : null, extra || null) : null,
    ),
    body,
  );
}

function toast(message) {
  const node = document.getElementById("toast");
  node.textContent = message;
  node.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { node.hidden = true; }, 2600);
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

/* ------------------------------------------------------------------- init */

async function boot() {
  try {
    if (window.location.protocol === "file:" && !STATIC_MODE) {
      throw new Error("页面需要通过本地服务打开，不能直接双击 HTML 文件");
    }
    if (STATIC_MODE) {
      const staticData = JSON.parse(EMBEDDED.textContent);
      state.overview = state.simulate
        ? staticData.simulations[state.simulate]
        : staticData.overview;
      state.industry = staticData.industry;
      state.staticPreviews = staticData.ask;
    } else {
      const url = state.simulate ? `/api/overview?simulate=${state.simulate}` : "/api/overview";
      state.overview = await api(url);
    }
    const loading = document.getElementById("loading");
    if (loading) loading.remove();
    render();
  } catch (err) {
    const loading = document.getElementById("loading");
    const hint = window.location.protocol === "file:"
      ? '<p class="footnote">请在终端运行 <code>python3 -m marketlens.app</code>，然后访问 <a href="http://127.0.0.1:8787/">http://127.0.0.1:8787/</a>，不要直接双击 HTML 文件。</p>'
      : '<p class="footnote">请确认本地服务已启动，并已生成市场快照。访问地址应为 <a href="http://127.0.0.1:8787/">http://127.0.0.1:8787/</a>。</p>';
    if (loading) {
      loading.innerHTML = `<p class="warn">读取失败：${String(err.message)}</p>${hint}`;
    }
  }
}

async function reload() {
  state.simulate = null;
  state.overview = null;
  state.industry = null;
  renderLoading();
  await boot();
}

function renderLoading() {
  document.getElementById("app").innerHTML =
    '<div class="loading" id="loading"><div class="spinner"></div><p>正在读取市场快照…</p></div>';
}

function render() {
  const o = state.overview;
  if (!o) return;
  const snap = o.snapshot;
  document.getElementById("as-of").textContent = `${dayLabel(snap.as_of)} 收盘`;
  const integrity = snap.integrity || {};
  const dot = document.getElementById("integrity-dot");
  dot.className = `dot ${integrity.level === "ok" ? "" : integrity.level}`;
  document.getElementById("integrity-text").textContent =
    `${integrity.simulated ? "模拟降级中" : integrity.level === "ok" ? "数据完整" : integrity.level === "partial" ? "存在数据缺口" : "关键数据缺失"}${STATIC_MODE ? " · 固定快照" : ""}`;

  const app = document.getElementById("app");
  app.replaceChildren();
  const view = h("div", { class: "view" });
  app.append(view);
  if (state.view === "overview") view.append(...renderOverview(snap, o.narrative));
  if (state.view === "style") view.append(...renderStyle(snap));
  if (state.view === "industry") { view.append(...renderIndustryShell()); loadIndustry(); }
  if (state.view === "risk") view.append(...renderRisk(snap));
  if (state.view === "history") view.append(...renderHistory(snap));
  if (state.view === "evidence") view.append(...renderEvidence(snap));
}

/* --------------------------------------------------------------- overview */

function renderOverview(snap, nar) {
  const regime = snap.regime || {};
  const reading = nar.reading || {};
  const b = snap.breadth || {};
  const integ = snap.integrity || {};

  const tags = [
    h("span", { class: "tag", text: `主矛盾 · ${DIM_LABEL[regime.main_dimension] || "—"}` }),
    h("span", { class: "tag", text: `交易日 ${dayLabel(snap.as_of)}` }),
    snap.market_closed ? h("span", { class: "tag", text: "非交易日 · 读取最近收盘" }) : null,
    STATIC_MODE ? h("span", { class: "tag", text: "静态快照" }) : null,
  ];
  if (integ.level !== "ok") {
    tags.push(h("span", { class: "tag alert", text: `${(integ.issues || []).length} 项数据完整性提示` }));
  }

  const hero = h("section", { class: "state-band" },
    h("div", { class: "state-main" },
      h("div", { class: "state-kicker" },
        h("span", { text: "状态研判" }),
        h("span", { class: "sep" }),
        h("span", { text: "确定性规则 · 证据可回溯" }),
      ),
      h("h1", { class: "state-label", text: regime.label || "—" }),
      h("p", { class: "state-summary", text: reading.summary || "" }),
      h("div", { class: "state-tags" }, tags),
    ),
    h("div", { class: "state-side" },
      h("div", { class: "state-cell" },
        h("div", { class: "k", text: "置信度" }),
        h("div", { class: "v", text: regime.confidence || "—" }),
        h("div", { class: "n", text: `证据覆盖 ${regime.coverage_pct ?? "—"}%` }),
      ),
      h("div", { class: "state-cell" },
        h("div", { class: "k", text: "可用证据" }),
        h("div", { class: "v", text: `${regime.evidence_ok ?? 0} / ${(snap.evidence || []).length}` }),
        h("div", { class: "n", text: `过期 ${regime.evidence_stale ?? 0} · 冲突/失败 ${regime.evidence_error ?? 0}` }),
      ),
    ),
  );

  const dims = dimensionCards(snap);
  const contradiction = panel("主要矛盾", "归纳层",
    h("div", { class: "panel-body" },
      h("p", { class: "state-summary", text: reading.main_contradiction || "—" }),
      (reading.tension || []).length
        ? h("ul", { class: "list" }, reading.tension.map((t) => h("li", { text: t })))
        : null,
      h("div", { class: "state-tags", style: "margin-top:10px" },
        (reading.uncertainties || []).slice(0, 3).map((u) => h("span", { class: "tag", text: u })),
      ),
    ),
  );

  const indexTable = renderIndexTable(snap.indices || []);
  const assistant = renderAssistant();

  const switches = renderSwitches(snap.switch_conditions || []);

  return [
    hero,
    h("div", { class: "dimension-grid" }, dims),
    h("div", { class: "overview-grid" },
      panel("主要指数", `${dayLabel(snap.as_of)} 收盘 · 日线`, indexTable),
      assistant,
    ),
    contradiction,
    switches,
    h("p", { class: "footnote", text: reading.quant_note || "" }),
  ];
}

function scoreMeter(score) {
  const pos = Math.max(-2, Math.min(2, score || 0));
  const left = `${((pos + 2) / 4) * 100}%`;
  return h("div", { class: "score-track", title: `证据净分 ${pos}` },
    h("i", { class: "score-zero" }),
    h("i", { class: "score-mark", style: `left:${left}` }),
  );
}

function dimensionCards(snap) {
  const b = snap.breadth || {};
  const s = snap.sentiment || {};
  const st = snap.style || {};
  const v = snap.valuation || {};
  const liq = snap.liquidity || {};
  const r = snap.risk || {};
  const scores = (snap.regime || {}).scores || {};
  const idx = Object.fromEntries((snap.indices || []).map((x) => [x.thscode, x]));
  const hs = idx["000300.SH"] || {};
  const size = st.size || {};

  const defs = [
    {
      key: "structure", state: snap.trend === "上行" ? "均线上方" : snap.trend === "下行" ? "均线下方" : "均线缠绕",
      metrics: [["沪深300 距 MA20", signed(hs.last && hs.ma20 ? (hs.last / hs.ma20 - 1) * 100 : null, 2, "%")],
                ["20 日收益", signed(hs.ret_20d_pct)]],
    },
    {
      key: "breadth", state: b.up_ratio_pct == null ? "数据缺失" : b.up_ratio_pct >= 60 ? "宽度扩张" : b.up_ratio_pct < 45 ? "宽度收缩" : "宽度中性",
      metrics: [["上涨占比", pctText(b.up_ratio_pct)], ["5 日宽度", pctText(b.up_5d_ratio_pct)]],
    },
    {
      key: "style", state: (size.spread_20d_pct || 0) > 2 ? "小盘占优" : (size.spread_20d_pct || 0) < -2 ? "大盘占优" : "风格均衡",
      metrics: [["小盘−大盘 20 日", signed(size.spread_20d_pct, 2, " pct")],
                ["成长−价值 20 日", signed((st["562310.SH"] || {}).spread_20d_pct, 2, " pct")]],
    },
    {
      key: "valuation", state: v.pe_median ? "横截面水平" : "数据缺失",
      metrics: [["PE(TTM) 中位数", v.pe_median ? `${fx(v.pe_median)}×` : "—"], ["亏损面", pctText(v.loss_ratio_pct)]],
    },
    {
      key: "liquidity", state: (liq.turnover_vs_5d_pct || 0) > 15 ? "明显放量" : (liq.turnover_vs_5d_pct || 0) < -15 ? "明显缩量" : "量能平稳",

    },
    {

    },
  ];

  return defs.map((d) => {
    const sc = scores[d.key] || { score: 0, supporting: 0, opposing: 0 };
    return h("button", {
      class: "dim", type: "button",
      onclick: () => openDimension(d.key),
      "aria-label": `${DIM_LABEL[d.key]}详情`,

        d.metrics.map(([k, val]) => h("div", { class: "dim-metric" }, h("span", { text: k }), h("b", { text: val }))),
      ),
      scoreMeter(sc.score),
    );
  });
}

function renderSwitches(conditions) {
  const rows = conditions.map((c) => {

    const closeness = Math.max(0, Math.min(100, 100 - Math.abs(distance || 0) * 8));
    return h("tr", { class: "switch-row" },
      h("td", {}, h("span", { class: "pill neutral", text: DIM_LABEL[c.dimension] || c.dimension })),
      h("td", { class: "switch-cond", text: c.text }),
      h("td", { text: fx(c.current, 2) }),

      ),
      h("td", { class: "switch-effect", text: c.effect }),

  ));
}

async function submitAsk(question) {
  if (!question || state.busy) return;
  state.busy = true;
  const out = document.getElementById("ask-output");
  if (out) out.replaceChildren(h("p", { class: "footnote", text: "正在生成取数计划…" }));
  try {
    if (STATIC_MODE) {
      const normalized = question.trim();
      state.ask = state.staticPreviews[normalized] || staticAnswerFallback(normalized);
    } else {
      state.ask = await api("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
    }
  } catch (err) {
    state.ask = { error: String(err.message) };
  } finally {
    state.busy = false;
    const target = document.getElementById("ask-output");
    if (target) target.replaceChildren(renderAsk(state.ask));
  }
}

const STATIC_FORBIDDEN = {
  prediction: ["会涨", "会跌", "涨到", "跌到", "明天", "下周", "后市", "预测", "看多", "看空", "目标价", "点位"],
  advice: ["买", "卖", "抄底", "加仓", "减仓", "清仓", "仓位", "建仓", "止盈", "止损", "推荐", "重仓", "梭哈"],
};

function staticBlockedResult(question) {
  const text = question.toLowerCase();
  const kind = Object.keys(STATIC_FORBIDDEN).find((name) =>
    STATIC_FORBIDDEN[name].some((word) => text.includes(word)));
  if (!kind) return null;
  return {
    blocked: true,
    kind,
    message: "这个问题要求的是涨跌预测或交易动作，超出本产品边界。可以改为问「当前状态由哪些证据支持」「哪些条件会改变判断」。",
    reframe: [
      "当前市场状态是什么，由哪些证据支持？",
      "哪些条件会让我改变当前判断？",
      "宽度和情绪之间是否存在背离？",
    ],
  };
}

function staticAnswerFallback(question) {
  const blocked = staticBlockedResult(question);
  if (blocked) return blocked;
  const o = state.overview || {};
  const snap = o.snapshot || {};
  const nar = o.narrative || {};
  const reading = nar.reading || {};
  const facts = (nar.facts || []).slice(0, 5);
  const evidence = [...new Set(facts.flatMap((x) => x.evidence || []))];
  const blocks = [
    `当前状态：${(snap.regime || {}).label || "—"}。`,
    ...facts.map((x) => x.text),
  ];
  if (reading.main_contradiction) blocks.push(reading.main_contradiction);
  blocks.push("固定快照版对自由措辞先返回总览证据；宽度、情绪、风格、行业、风险、估值、量能或历史阶段可直接点击示例问题获取专题回答。");
  return {
    blocked: false,
    plan: { steps: [{ topic: "overview", label: "市场总览", needs: ["结构", "宽度", "情绪", "风格", "流动性", "主要矛盾"] }] },
    answer: {
      blocks,
      evidence,
      disclaimer: `固定快照：${snap.as_of || "—"} 收盘。以上为当前状态的证据描述，不构成涨跌预测或交易建议。`,
    },
    as_of: snap.as_of,
  };
}

function renderAsk(result) {
  if (!result) return h("p", { class: "footnote", text: "—" });
  if (result.error) return h("div", { class: "blocked", text: result.error });
  if (result.blocked) {
    return h("div", { class: "blocked" },
      h("strong", { text: "超出产品边界" }),
      h("p", { text: result.message }),
      h("div", { class: "chips" }, (result.reframe || []).map((q) =>
        h("button", { class: "chip", type: "button", text: q, onclick: () => submitAsk(q) }))),
    );
  }
  const plan = (result.plan && result.plan.steps) || [];
  const planEl = h("div", { class: "plan" },
    h("div", { class: "plan-head" }, h("span", { text: "取数计划" }), h("span", { text: `${plan.length} 步` })),
    plan.map((step, i) => h("div", { class: "plan-step" },
      h("span", { class: "idx", text: String(i + 1).padStart(2, "0") }),
      h("div", {}, h("div", { text: step.label }), h("div", { class: "needs", text: step.needs.join(" · ") })),
    )),
  );
  const ans = result.answer || {};
  const answerEl = h("div", { class: "answer" },
    (ans.blocks || []).map((text) => h("div", { class: "answer-block", text })),
    h("div", { class: "answer-refs" }, (ans.evidence || []).map((id) =>
      h("button", { class: "ref", type: "button", text: id, onclick: () => openEvidenceById(id) }))),
    h("p", { class: "footnote", text: ans.disclaimer || "" }),
  );
  return h("div", { style: "display:flex;flex-direction:column;gap:10px" }, planEl, answerEl);
}

  const distRows = Object.entries(states).sort((a, b) => b[1] - a[1]).map(([k, v]) => h("tr", {},
    h("td", { class: "name", text: k }),
    h("td", { text: `${v} 天` }),
    h("td", { text: `${((v / total) * 100).toFixed(1)}%` }),
    h("td", {}, h("div", { class: "bar-track", style: "width:120px;display:inline-block" },
      h("i", { class: "bar-fill", style: `left:0;width:${(v / total) * 100}%;background:${k === "上行" ? "var(--up)" : k === "下行" ? "var(--down)" : "var(--faint)"}` }))),
  ));

  const similar = findSimilar(series, 5);
  const simRows = similar.map((x) => h("tr", {},
    h("td", { class: "name", text: dayLabel(isoFromMs(x.date_ms)) }),
    h("td", { text: x.state }),
    h("td", { class: dirClass(x.ret_20d_pct), text: signed(x.ret_20d_pct, 2) }),
    h("td", { text: `${x.vol.toFixed(1)}%` }),
    h("td", { class: dirClass(x.future_20d_pct), text: x.future_20d_pct === null ? "—" : signed(x.future_20d_pct, 2) }),
  ));

  return [
    h("section", { class: "panel" },
      h("div", { class: "panel-head" }, h("h2", { text: "沪深300 · 状态序列" }), h("div", { class: "sub", text: "近三年日线 · 状态由 MA20/MA60 规则判定" })),
      h("div", { class: "panel-body" }, chart),
      h("div", { class: "chart-legend" },
        legend("上行", "var(--up)"), legend("震荡", "var(--faint)"), legend("下行", "var(--down)")),
      h("div", { class: "chart-note", text: "背景色为逐日状态判定结果，不是事后拟合。状态只描述当日价格与均线关系。" }),
    ),
    h("div", { class: "two-col" },
      panel("状态分布", `${total} 个交易日`, table(["状态", "天数", "占比", ""], distRows)),
      panel("历史相似窗口", "按 20 日收益 + 波动率最接近", h("div", {},
        table(["日期", "状态", "20 日收益", "20 日波动", "后续 20 日"], simRows),
        h("p", { class: "footnote", style: "padding:10px 14px", text: "“后续 20 日”仅为历史样本的同期统计，用于理解状态的历史分布，不是概率估计，也不构成任何预测。" }),
      )),
    ),
  ];
}

function findSimilar(series, k) {
  const current = series[series.length - 1];
  const featuresAt = (i) => {
    const row = series[i];
    const window = series.slice(i - 19, i + 1);
    const rets = [];
    for (let j = 1; j < window.length; j++) rets.push(window[j].close / window[j - 1].close - 1);
    const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
    const vol = Math.sqrt(rets.reduce((a, b) => a + (b - mean) ** 2, 0) / rets.length) * Math.sqrt(252) * 100;
    return { ...row, vol };
  };
  if (series.length < 81) return [];
  const target = featuresAt(series.length - 1);
  const enriched = [];
  for (let i = 60; i < series.length - 20; i++) {
    const row = featuresAt(i);
    const future = series[i + 20] && row.close ? (series[i + 20].close / row.close - 1) * 100 : null;
    enriched.push({ ...row, future_20d_pct: future });
  }
  if (!enriched.length) return [];
  const norm = (x) => Math.abs((x.ret_20d_pct || 0) - (current.ret_20d_pct || 0)) / 10 + Math.abs(x.vol - target.vol) / 10;
  return enriched.sort((a, b) => norm(a) - norm(b)).slice(0, k);
}

function isoFromMs(ms) {
  return new Date(ms).toLocaleDateString("sv-SE", { timeZone: "Asia/Shanghai" });
}

function legend(label, color) {
  return h("span", { class: "legend-item" }, h("i", { class: "legend-swatch", style: `background:${color}` }), label);

function renderEvidence(snap) {
  const evidence = snap.evidence || [];

  const searchInput = h("input", { type: "search", placeholder: "搜索指标或口径", "aria-label": "搜索证据" });

    h("option", { value: "", text: "全部维度" }),
    dims.map((d) => h("option", { value: d, text: DIM_LABEL[d] || d })),
  );
  const statusSelect = h("select", { class: "select", "aria-label": "按状态筛选" },
    h("option", { value: "", text: "全部状态" }),
    h("option", { value: "ok", text: "正常" }),
    h("option", { value: "stale", text: "过期缓存" }),
    h("option", { value: "error", text: "失败" }),
    h("option", { value: "conflict", text: "冲突" }),
  );

  const tbody = h("tbody");
  const count = h("span", { class: "faint" });

  const paint = () => {
    const q = searchInput.value.trim().toLowerCase();
    const dim = dimSelect.value;
    const status = statusSelect.value;
    const rows = evidence.filter((x) =>
      (!dim || x.dimension === dim) &&

    tbody.replaceChildren(...rows.map((x) => h("tr", {},
      h("td", { class: "name clickable", onclick: () => openEvidence(x.id) }, x.label,
        h("div", { class: "code", text: x.id })),
      h("td", {}, h("span", { class: "pill neutral", text: DIM_LABEL[x.dimension] || x.dimension })),
      h("td", { text: x.display || "—" }),
      h("td", { text: x.as_of || "—" }),
      h("td", {}, h("span", { class: `pill ${x.status}`, text: statusLabel(x.status) })),
    )));
    count.textContent = `${rows.length} / ${evidence.length} 条`;
  };
  searchInput.addEventListener("input", paint);
  dimSelect.addEventListener("change", paint);
  statusSelect.addEventListener("change", paint);
  paint();

  const planRows = plan.map((p, i) => h("tr", {},
    h("td", { text: String(i + 1).padStart(2, "0") }),

    h("td", {}, h("span", { class: `pill ${p.status === "ok" ? "ok" : p.status === "stale" ? "stale" : "error"}`, text: statusLabel(p.status) })),
    h("td", { class: "mono", style: "font-size:10px", text: p.request_id || "—" }),
  ));

  return [
    h("section", { class: "panel" },
      h("div", { class: "toolbar" },
        h("div", { class: "search" },
          h("svg", { viewBox: "0 0 24 24", html: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>' }),
          searchInput),
        dimSelect, statusSelect,
        h("div", { style: "margin-left:auto" }, count),
      ),
      h("div", { class: "table-wrap" },
        h("table", { class: "data" },
          h("thead", {}, h("tr", {}, ["证据", "维度", "值", "时点", "状态"].map((x) => h("th", { text: x })))),
          tbody)),
    ),
    panel("取数计划与请求追踪", `${plan.length} 次调用`, table(
      ["#", "数据项", "端", "状态", "request_id"], planRows)),
    h("p", { class: "footnote", text: "每条证据都保留 endpoint、request_id、抓取时间与计算口径。点击证据名可查看原始字段。" }),
  ];

function divergingRow(name, value) {

  );

function lineChart({ points, labels, height = 220, color = "#17697f", zeroLine = false, endLabel = null, yFormat = (v) => v }) {
  const W = 900;
  const H = height;
  const pad = { l: 46, r: 54, t: 14, b: 22 };
  if (!points || !points.length) return h("div", { class: "empty", text: "无序列数据" });
  const min = Math.min(...points);
  const max = Math.max(...points);
  const padY = (max - min) * 0.15 || 1;
  const lo = min - padY;
  const hi = max + padY;
  const x = (i) => pad.l + (i / Math.max(1, points.length - 1)) * (W - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);

  const path = points.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${path}L${x(points.length - 1).toFixed(1)},${y(lo).toFixed(1)}L${x(0).toFixed(1)},${y(lo).toFixed(1)}Z`;
  const gridVals = [lo + (hi - lo) * 0.1, lo + (hi - lo) * 0.35, lo + (hi - lo) * 0.65, lo + (hi - lo) * 0.9];
  const gid = `g${Math.random().toString(36).slice(2, 8)}`;

  return h("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "走势图" },
    h("defs", {}, h("linearGradient", { id: gid, x1: "0", y1: "0", x2: "0", y2: "1" },
      h("stop", { offset: "0%", "stop-color": color, "stop-opacity": ".16" }),
      h("stop", { offset: "100%", "stop-color": color, "stop-opacity": "0" }))),
    gridVals.map((v) => h("g", {},
      h("line", { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v), stroke: "#e8ebef", "stroke-width": "1" }),
      h("text", { x: pad.l - 6, y: y(v) + 3, "text-anchor": "end", "font-size": "9", fill: "#98a0ab", text: yFormat(v) }),
    )),
    zeroLine && lo < 0 && hi > 0
      ? h("line", { x1: pad.l, x2: W - pad.r, y1: y(0), y2: y(0), stroke: "#c9d0d8", "stroke-width": "1", "stroke-dasharray": "3 3" })
      : null,
    h("path", { d: area, fill: `url(#${gid})` }),
    h("path", { d: path, fill: "none", stroke: color, "stroke-width": "1.6", "stroke-linejoin": "round", "stroke-linecap": "round" }),
    h("circle", { cx: x(points.length - 1), cy: y(points[points.length - 1]), r: "2.6", fill: color }),
    endLabel ? h("text", { x: x(points.length - 1) + 7, y: y(points[points.length - 1]) + 3, "font-size": "10", fill: color, text: endLabel }) : null,
    h("text", { x: pad.l, y: H - 5, "font-size": "9", fill: "#98a0ab", text: labels[0] }),
    h("text", { x: W - pad.r, y: H - 5, "font-size": "9", fill: "#98a0ab", "text-anchor": "end", text: labels[labels.length - 1] }),
  );
}

function historyChart(series) {
  const W = 980, H = 300;
  const pad = { l: 48, r: 56, t: 14, b: 26 };
  const closes = series.map((x) => x.close);
  const ma20 = series.map((x) => x.ma20);
  const ma60 = series.map((x) => x.ma60);
  const all = closes.concat(ma20, ma60);
  const lo = Math.min(...all) * 0.985;
  const hi = Math.max(...all) * 1.015;
  const x = (i) => pad.l + (i / (series.length - 1)) * (W - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
  const path = (arr) => arr.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");

  // regime bands
  const bands = [];
  let start = 0;
  for (let i = 1; i <= series.length; i++) {
    if (i === series.length || series[i].state !== series[start].state) {
      bands.push({ from: start, to: i - 1, state: series[start].state });
      start = i;
    }
  }
  const colorFor = (s) => (s === "上行" ? "rgba(176,42,34,.07)" : s === "下行" ? "rgba(12,111,84,.09)" : "rgba(152,160,171,.07)");

  const gid = "histArea";
  const last = series[series.length - 1];
  return h("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "沪深300 状态序列" },
    h("defs", {}, h("linearGradient", { id: gid, x1: "0", y1: "0", x2: "0", y2: "1" },
      h("stop", { offset: "0%", "stop-color": "#17697f", "stop-opacity": ".12" }),
      h("stop", { offset: "100%", "stop-color": "#17697f", "stop-opacity": "0" }))),
    bands.map((b) => h("rect", {
      x: x(b.from), y: pad.t, width: Math.max(1, x(b.to) - x(b.from)), height: H - pad.t - pad.b,
      fill: colorFor(b.state),
    })),
    [0.15, 0.4, 0.65, 0.9].map((f) => {
      const v = lo + (hi - lo) * f;
      return h("g", {},
        h("line", { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v), stroke: "#e8ebef", "stroke-width": "1" }),
        h("text", { x: pad.l - 6, y: y(v) + 3, "text-anchor": "end", "font-size": "9", fill: "#98a0ab", text: v.toFixed(0) }),
      );
    }),
    h("path", { d: `${path(closes)}L${x(series.length - 1)},${y(lo)}L${x(0)},${y(lo)}Z`, fill: `url(#${gid})` }),
    h("path", { d: path(ma60), fill: "none", stroke: "#b9a06a", "stroke-width": "1.1", "stroke-dasharray": "4 3" }),
    h("path", { d: path(ma20), fill: "none", stroke: "#7f8b9c", "stroke-width": "1.1" }),
    h("path", { d: path(closes), fill: "none", stroke: "#14171c", "stroke-width": "1.5" }),
    h("circle", { cx: x(series.length - 1), cy: y(last.close), r: "2.8", fill: "#14171c" }),
    h("text", { x: x(series.length - 1) + 7, y: y(last.close) + 3, "font-size": "10", fill: "#14171c", text: last.close.toFixed(0) }),
    h("text", { x: pad.l, y: H - 8, "font-size": "9", fill: "#98a0ab", text: isoFromMs(series[0].date_ms) }),
    h("text", { x: W - pad.r, y: H - 8, "font-size": "9", fill: "#98a0ab", "text-anchor": "end", text: isoFromMs(last.date_ms) }),
  );
}

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {

async function refreshLive() {
  if (STATIC_MODE) {
    toast("当前为固定快照；更新数据需重新生成本页");
    return;
  }
  const btn = document.getElementById("refresh-button");
  if (btn.classList.contains("spinning")) return;
  btn.classList.add("spinning");
  try {
    await api("/api/refresh", { method: "POST" });
    toast("已开始后台刷新，正在等待新快照…");
    for (let i = 0; i < 45; i++) {
      await new Promise((r) => setTimeout(r, 2000));
      const health = await api("/api/health");
      if (!health.refreshing) {
        await reload();
        toast("快照已更新");
        return;
      }
    }
    toast("刷新耗时较长，可稍后重试");
  } catch (err) {
    toast(`刷新失败：${err.message}`);
  } finally {
    btn.classList.remove("spinning");
  }
}

</script>
</body>
</html>
