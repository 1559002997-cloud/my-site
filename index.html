<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>势研 · A股市场状态研判</title>
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 17.5 8.5 12l3.6 3.2L21 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15.5 6H21v5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-text">
        <strong>势研</strong>
        <span>市场状态研判 · A 股</span>
      </div>
    </div>
    <div class="topbar-meta">
      <div class="meta-item">
        <span class="meta-label">数据时点</span>
        <span class="meta-value" id="as-of">—</span>
      </div>
      <button class="integrity-pill" id="integrity-pill" type="button" aria-haspopup="dialog">
        <span class="dot" id="integrity-dot"></span>
        <span id="integrity-text">数据完整性</span>
      </button>
      <button class="icon-button" id="refresh-button" type="button" title="重新取数" aria-label="重新取数">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="overview" role="tab">总览</button>
    <button class="tab" data-view="style" role="tab">风格</button>
    <button class="tab" data-view="industry" role="tab">行业</button>
    <button class="tab" data-view="risk" role="tab">风险</button>
    <button class="tab" data-view="history" role="tab">历史阶段</button>
    <button class="tab" data-view="evidence" role="tab">证据台账</button>
  </nav>

  <main id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在读取市场快照…</p>
    </div>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="证据详情">
    <div class="drawer-head">
      <div>
        <p class="eyebrow">Evidence detail</p>
        <h2 id="drawer-title">证据详情</h2>
      </div>
      <button class="icon-button" id="drawer-close" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="dialog-backdrop" id="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title">数据完整性</h2>
        <button class="icon-button" id="dialog-close" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div id="dialog-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="static/app.js"></script>
</body>
</html>
